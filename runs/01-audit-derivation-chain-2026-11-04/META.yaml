operator: "michaelClucas"
notes: >
  Six retrieval subagents ran in parallel across the natural divisions: the
  averaging formalism; Wiltshire's timescape papers and the Cosmological
  Equivalence Principle; the Green-Wald versus Buchert backreaction dispute;
  the timescape supernova analyses; CMB, BAO and Hubble-flow tests; and
  rivals with their constraints. Each was instructed to report only locators
  it had fetched, to mark author-plus-year material as an unverified lead, and
  to list every URL it successfully fetched. The synthesising agent
  independently re-fetched every source behind a central claim rather than
  passing a subagent's locator through; where a subagent reported something
  the synthesiser could not verify, it is tagged [LEAD] or flagged in the
  gaps.

  Three findings reclassify the seed chain and are the substance of this run:
  (1) the seed's D2 THEOREM tag covers one exact identity and one statement
  that is nowhere a theorem in the retrieved literature and that timescape
  does not use; (2) the seed's D4 is not timescape's mechanism - the model's
  own fitted solution has Omega-bar_Q0 = -0.0293, negative, with q-bar > 0
  and no volume acceleration, and the bare budget is dominated by average
  negative spatial curvature at Omega-bar_k0 = 0.862, so the Green-Wald
  dispute as fought does not engage it; (3) the seed has no step for light
  propagation, which carries weight 3 and which both Buchert and Wiltshire
  state in print is not yet justified.

  O1 and O2 are both recorded resolved: false, with both sides from primary
  sources and no verdict. O4 is recorded resolved: true, but only for the
  narrow factual question the seed asked - whether f_v0 is fitted or
  independently determined - and the resolution note says so explicitly. No
  verdict is given on whether timescape is correct, and no extension or
  modification is proposed anywhere in the output.

  Branch history note: an earlier commit on this branch (2f74a1d) landed a
  partial run - PART1.draft.md and HANDOVER.md - when the run was interrupted
  by a usage limit. Those files are removed in the completing commit and
  their content is superseded by OUTPUT.md. The run was not restarted, so the
  context remained clean across the interruption.
